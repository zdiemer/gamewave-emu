<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="gamewave: a Game Wave Family Entertainment System emulator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2240"/>
      <stop offset="0.55" stop-color="#101630"/>
      <stop offset="1" stop-color="#080b1a"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb4ff"/>
      <stop offset="0.5" stop-color="#e8eefc"/>
      <stop offset="1" stop-color="#8fb4ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4c542" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f4c542" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d9322b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="250" rx="18" fill="url(#bg)"/>

  <!-- the wave: two ribbons, gold over red, as on the console's own logo screen -->
  <path d="M 120 96 C 230 40, 330 120, 470 66" fill="none" stroke="#f4c542" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M 730 86 C 870 32, 970 112, 1080 56" fill="none" stroke="#d9322b" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- the disc: a DVD read as files, not tracks -->
  <g transform="translate(600 76)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#disc)" stroke-width="5"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#8fb4ff" stroke-width="1.5" opacity="0.45"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#e8eefc" stroke-width="1.5" opacity="0.35"/>
    <circle cx="0" cy="0" r="11" fill="#080b1a" stroke="#8fa3c0" stroke-width="2"/>
    <!-- the six player remotes, in the games' order -->
    <circle cx="-100" cy="0" r="7" fill="#d9322b"/>
    <circle cx="-80" cy="0" r="7" fill="#f4c542"/>
    <circle cx="-60" cy="0" r="7" fill="#2f6fe0"/>
    <circle cx="60" cy="0" r="7" fill="#3cb04a"/>
    <circle cx="80" cy="0" r="7" fill="#8a4fd0"/>
    <circle cx="100" cy="0" r="7" fill="#f08a24"/>
  </g>

  <text x="600" y="176" text-anchor="middle"
        font-family="Verdana, DejaVu Sans, Geneva, sans-serif" font-size="82" font-weight="bold"
        fill="#eef2fc" letter-spacing="4">gamewave</text>

  <text x="600" y="208" text-anchor="middle"
        font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="18"
        fill="#8fa3c0" letter-spacing="5">GAME WAVE &#183; DVD &#183; LUA 5.0 &#183; 720&#215;480</text>

  <rect x="370" y="226" width="460" height="2" fill="url(#glow)"/>
</svg>

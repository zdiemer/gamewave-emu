name: CI

on:
  push:
    branches: [main]
  pull_request:

# The SDL front end is never opened in CI, so nothing here needs a display; the
# tests exercise GameWave.Core and the CLI, both of which are headless by design.
env:
  # Directory.Build.props already sets InvariantGlobalization, so the build and
  # the tests never touch ICU. Saying so here means the dotnet CLI itself does
  # not either, which keeps the Linux leg working on a minimal runner image.
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish and smoke-test libretro (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/GameWave.Libretro -c Release -r win-x64 -o artifacts/libretro/win-x64
          if ($LASTEXITCODE -ne 0) { throw "libretro publish failed" }
          cl /nologo /std:c11 /W4 /WX /O2 tests/libretro/smoke.c /Fe:artifacts/libretro/smoke.exe /Fo:artifacts/libretro/smoke.obj
          if ($LASTEXITCODE -ne 0) { throw "smoke test compilation failed" }
          & artifacts/libretro/smoke.exe "$PWD/artifacts/libretro/win-x64/gamewave_libretro.dll" "$PWD/artifacts/libretro/smoke-data"
          if ($LASTEXITCODE -ne 0) { throw "libretro smoke test failed" }
          cl /nologo /std:c11 /W4 /WX /O2 tests/libretro/determinism.c /Fe:artifacts/libretro/determinism.exe /Fo:artifacts/libretro/determinism.obj
          if ($LASTEXITCODE -ne 0) { throw "determinism test compilation failed" }
          & artifacts/libretro/determinism.exe "$PWD/artifacts/libretro/win-x64/gamewave_libretro.dll" "$PWD/artifacts/libretro/determinism-data"
          if ($LASTEXITCODE -ne 0) { throw "libretro determinism test failed" }
          cl /nologo /std:c11 /W4 /WX /O2 tests/libretro/features.c /Fe:artifacts/libretro/features.exe /Fo:artifacts/libretro/features.obj
          if ($LASTEXITCODE -ne 0) { throw "feature test compilation failed" }
          & artifacts/libretro/features.exe "$PWD/artifacts/libretro/win-x64/gamewave_libretro.dll" "$PWD/artifacts/libretro/features-data"
          if ($LASTEXITCODE -ne 0) { throw "libretro feature test failed" }

      - name: Publish and smoke-test libretro (Linux)
        if: runner.os == 'Linux'
        run: |
          dotnet publish src/GameWave.Libretro -c Release -r linux-x64 -o artifacts/libretro/linux-x64
          cc -std=c11 -Wall -Wextra -Werror -O2 tests/libretro/smoke.c -ldl -o artifacts/libretro/smoke
          artifacts/libretro/smoke "$PWD/artifacts/libretro/linux-x64/gamewave_libretro.so" "$PWD/artifacts/libretro/smoke-data"
          cc -std=c11 -Wall -Wextra -Werror -O2 tests/libretro/determinism.c -ldl -o artifacts/libretro/determinism
          artifacts/libretro/determinism "$PWD/artifacts/libretro/linux-x64/gamewave_libretro.so" "$PWD/artifacts/libretro/determinism-data"
          cc -std=c11 -Wall -Wextra -Werror -O2 tests/libretro/features.c -ldl -o artifacts/libretro/features
          artifacts/libretro/features "$PWD/artifacts/libretro/linux-x64/gamewave_libretro.so" "$PWD/artifacts/libretro/features-data"

      - uses: actions/upload-artifact@v4
        with:
          name: libretro-${{ matrix.os }}
          path: |
            artifacts/libretro/*/gamewave_libretro.dll
            artifacts/libretro/*/gamewave_libretro.so
            artifacts/libretro/*/gamewave_libretro.info
          if-no-files-found: error
